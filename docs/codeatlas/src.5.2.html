<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CodeAtlas</title>
<script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #cy { width: 100vw; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <strong>CodeAtlas</strong>
  <p>Owns 20 symbols across 6 file(s).</p>
</header>
<div id="cy"></div>
<script>
const data = {"nodes": [{"data": {"id": "__tests__", "label": "__tests__", "description": "Owns 0 symbols across 3 file(s)."}}, {"data": {"id": "api", "label": "api", "description": "Owns 93 symbols across 10 file(s)."}}, {"data": {"id": "assets", "label": "assets", "description": "Owns 0 symbols across 3 file(s)."}}, {"data": {"id": "components", "label": "components", "description": "Owns 397 symbols across 57 file(s)."}}, {"data": {"id": "hooks", "label": "hooks", "description": "Owns 31 symbols across 10 file(s)."}}, {"data": {"id": "lib", "label": "lib", "description": "Owns 129 symbols across 11 file(s)."}}, {"data": {"id": "pages", "label": "pages", "description": "Owns 8 symbols across 1 file(s)."}}, {"data": {"id": "store", "label": "store", "description": "Owns 12 symbols across 3 file(s)."}}, {"data": {"id": "styles", "label": "styles", "description": "Owns 0 symbols across 2 file(s)."}}, {"data": {"id": "types", "label": "types", "description": "Owns 17 symbols across 2 file(s)."}}], "edges": [{"data": {"id": "edge_0", "source": "src", "target": "types", "label": "calls"}}, {"data": {"id": "edge_1", "source": "src", "target": "components", "label": "calls"}}, {"data": {"id": "edge_2", "source": "src", "target": "hooks", "label": "calls"}}, {"data": {"id": "edge_3", "source": "components", "target": "src", "label": "calls"}}, {"data": {"id": "edge_4", "source": "components", "target": "types", "label": "calls"}}, {"data": {"id": "edge_5", "source": "components", "target": "api", "label": "calls"}}, {"data": {"id": "edge_6", "source": "components", "target": "hooks", "label": "calls"}}, {"data": {"id": "edge_7", "source": "components", "target": "lib", "label": "calls"}}, {"data": {"id": "edge_8", "source": "hooks", "target": "api", "label": "calls"}}, {"data": {"id": "edge_9", "source": "lib", "target": "api", "label": "calls"}}, {"data": {"id": "edge_10", "source": "pages", "target": "lib", "label": "calls"}}]};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: data,
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'shape': 'round-rectangle',
      'background-color': '#eef2ff',
      'border-color': '#6366f1',
      'border-width': 1,
      'width': 'label',
      'padding': '10px',
      'text-valign': 'center',
      'text-halign': 'center',
      'font-size': '12px',
    }},
    { selector: 'edge', style: {
      'label': 'data(label)',
      'curve-style': 'bezier',
      'target-arrow-shape': 'triangle',
      'font-size': '10px',
      'text-rotation': 'autorotate',
    }}
  ],
  layout: { name: 'dagre', rankDir: 'LR' }
});
cy.on('tap', 'node', evt => {
  const node = evt.target;
  if (node.data('linkUrl')) { window.location.href = node.data('linkUrl'); }
});
</script>
</body>
</html>
