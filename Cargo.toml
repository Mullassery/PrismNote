[workspace]
members = ["crates/server"]
resolver = "2"

[workspace.package]
version = "1.2.1"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "MIT"
repository = "https://github.com/Mullassery/prismnote"

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
zeromq = "0.4"
tempfile = "3"
anyhow = "1"
thiserror = "1"
regex = "1"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
dirs = "5"
chrono = "0.4"
strum = "0.25"
strum_macros = "0.25"
rust-embed = "8"
jsonwebtoken = "9"
bcrypt = "0.15"
rand = "0.8"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "chrono", "uuid"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
