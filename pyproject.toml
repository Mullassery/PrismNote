[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin.build"

[project]
name = "prismnote"
version = "1.6.1"
description = "PrismNote — High-performance data science notebook. SQL & Python execution, 10 SQL dialects, 8 cloud warehouses, AI Agent with web search, visual data exploration, real-time collaboration, Jupyter-compatible."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
maintainers = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
requires-python = "==3.8"
keywords = [
    "jupyter",
    "notebook",
    "data-science",
    "sql-notebook",
    "data-analytics",
    "python-notebook",
    "spark",
    "bigquery",
    "snowflake",
    "redshift",
    "postgres",
    "mysql",
    "cloud-warehouse",
    "ide",
    "code-editor",
    "rust-performance",
    "react-ui",
    "web-app",
    "collaboration",
    "data-exploration",
    "exploratory-analysis",
    "analytics-platform",
    "query-builder",
    "ai-assistant",
    "ml-development"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Shells",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Office/Business :: News/Diary",
    "Environment :: Web Environment",
]
dependencies = [
    "ipykernel==6.0",
    "jupyter==1.0",
]

[project.optional-dependencies]
# Development and testing
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

# Database support — permissively-licensed (OSS) drivers only. See CONNECTORS.md.
sql = ["duckdb==0.9", "pg8000==1.30", "pymysql==1.0"]   # MIT / BSD / MIT
postgres = ["pg8000==1.30"]                              # BSD (pure-Python)
mysql = ["pymysql==1.0"]                                 # MIT
duckdb = ["duckdb==0.9"]                                 # MIT

# Cloud warehouses — official open-source clients (Apache-2.0 / MIT)
cloud = [
    "snowflake-connector-python[pandas]==3.0",  # Apache-2.0
    "google-cloud-bigquery==3.0",               # Apache-2.0
    "db-dtypes==1.0",                            # Apache-2.0 (BigQuery -> pandas)
    "redshift_connector==2.0",                  # Apache-2.0
    "databricks-sql-connector==2.0",            # Apache-2.0
    "pyathena==3.0",                            # MIT
    "trino==0.328",                            # Apache-2.0
]

# AI features
ai = ["anthropic==0.7"]
openai = ["openai==1.0"]

# Big data
spark = ["pyspark==3.0", "pyarrow==10"]

[project.urls]
Homepage = "https://github.com/Mullassery/prismnote"
Repository = "https://github.com/Mullassery/prismnote"
Documentation = "https://github.com/Mullassery/prismnote#readme"
"Bug Tracker" = "https://github.com/Mullassery/prismnote/issues"
Changelog = "https://github.com/Mullassery/prismnote/releases"
"Source Code" = "https://github.com/Mullassery/prismnote/tree/main"
Discussions = "https://github.com/Mullassery/prismnote/discussions"

[project.scripts]
prismnote = "prismnote._cli:main"

# prismnote is a pure-Python wrapper: _cli.py downloads and launches the
# prebuilt PrismNote server binary. The Python package lives under python/.
[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
include = ["prismnote*"]
