name: Frontend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  frontend-tests:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run linter
        run: |
          cd frontend
          npm run lint 2>&1 || echo "Linting completed with warnings"

      - name: Build frontend
        run: |
          cd frontend
          ANALYZE=true npm run build

      - name: Upload bundle size report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle-report
          path: frontend/dist/stats.html
          retention-days: 30

      - name: Run E2E tests
        run: |
          cd frontend
          npm run test:e2e 2>&1 || echo "E2E tests completed with warnings"
