name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Python Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install "bandit>=1.7" "pip-audit>=2.7"
      - name: Bandit (medium and above)
        run: bandit -r python/ -ll
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit . --desc
