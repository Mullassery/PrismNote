version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - "Mullassery"

  - package-ecosystem: npm
    directory: "frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - "Mullassery"

  - package-ecosystem: pip
    directory: "python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - "Mullassery"
